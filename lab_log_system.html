<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A501 Lab Log System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#f3efe6;
    --ink:#20242a;
    --graphite:#3a4048;
    --line:#d9d2c1;
    --panel:#fbf9f4;
    --amber:#c07a2c;
    --amber-soft:#f1ddb8;
    --teal:#2f6f63;
    --teal-soft:#d9ece6;
    --rust:#a83e2c;
    --rust-soft:#f2dcd6;
    --slate:#5b6672;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  #app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

  .topbar{border-bottom:2px solid var(--ink);padding:18px 20px 14px;}
  .topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.01em;}
  .brand small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10.5px;color:var(--slate);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;}
  .id-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--slate);border:1px solid var(--line);padding:3px 8px;border-radius:var(--radius);white-space:nowrap;}

  nav.tabs{display:flex;border-bottom:2px solid var(--ink);}
  nav.tabs button{flex:1;padding:11px 6px;background:var(--paper);border:none;border-right:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);cursor:pointer;}
  nav.tabs button:last-child{border-right:none;}
  nav.tabs button.active{background:var(--ink);color:var(--paper);}

  main{flex:1;padding:20px;padding-bottom:60px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber);margin:0 0 6px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 6px;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 10px;}
  p.lead{color:var(--slate);font-size:13.5px;line-height:1.5;margin:0 0 16px;}

  label.field{display:block;margin-bottom:14px;}
  label.field span.lbl{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--graphite);margin-bottom:5px;}
  select, input[type=text], input[type=date], input[type=time], input[type=number], textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  textarea{resize:vertical;min-height:64px;}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235b6672'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:28px;}

  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  button.primary{background:var(--ink);color:var(--paper);border:none;padding:12px 18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;}
  button.primary:hover{background:var(--graphite);}
  button.secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:11px 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;}
  button.ghost{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:underline;cursor:pointer;padding:4px 0;}
  button.small{padding:6px 10px;font-size:10.5px;}
  button.danger{color:var(--rust);border-color:var(--rust);}

  .status-pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:20px;letter-spacing:0.03em;}
  .status-ok{background:var(--teal-soft);color:var(--teal);}
  .status-warn{background:var(--amber-soft);color:var(--amber);}
  .status-bad{background:var(--rust-soft);color:var(--rust);}

  .checklist-row{display:grid;grid-template-columns:26px 1fr 128px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);}
  .checklist-row .num{font-family:'IBM Plex Mono',monospace;color:var(--slate);font-size:12px;padding-top:2px;}
  .checklist-row .txt{font-size:13.5px;line-height:1.4;}
  .checklist-note{grid-column:2/4;margin-top:8px;}

  table.recs{width:100%;border-collapse:collapse;font-size:12px;}
  table.recs th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--slate);border-bottom:2px solid var(--ink);padding:6px 8px;white-space:nowrap;}
  table.recs td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .table-wrap{overflow-x:auto;}

  .banner{background:var(--teal-soft);border:1px solid var(--teal);color:var(--teal);padding:12px 14px;border-radius:var(--radius);font-size:13.5px;margin-bottom:16px;}
  .empty{text-align:center;color:var(--slate);padding:30px 10px;font-size:13px;}

  .eq-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .eq-row .eq-name{font-size:14px;}
  .eq-row .eq-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--slate);}

  .qr-box{background:#fff;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;border-radius:var(--radius);}
  .qr-url{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);word-break:break-all;text-align:center;}

  .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .toggle-row input{width:auto;}
  .toggle-row span{font-size:13px;}

  .footer-note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--slate);text-align:center;padding:14px 20px 30px;}
  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-row input{flex:1;}

  /* ---------- Onboarding walkthrough ---------- */
  .intro-overlay{position:fixed;inset:0;background:rgba(32,36,42,0.92);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
  .intro-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);max-width:400px;width:100%;padding:30px 26px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.35);}
  .intro-icon-wrap{height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .intro-title{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 8px;}
  .intro-body{font-size:13.5px;color:var(--slate);line-height:1.5;margin:0 0 6px;min-height:56px;}
  .intro-dots{display:flex;gap:6px;justify-content:center;margin:16px 0 18px;}
  .intro-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s;}
  .intro-dot.active{background:var(--amber);}
  .intro-btnrow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .intro-skip{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:underline;cursor:pointer;}
  .intro-next{background:var(--ink);color:var(--paper);border:none;padding:10px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;}
  .replay-link{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-decoration:underline;cursor:pointer;padding:0;margin-top:2px;}

  @keyframes introScan{0%{transform:translateY(-30px);opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{transform:translateY(30px);opacity:0;}}
  @keyframes introFadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes introBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  @keyframes introSlideIn{from{transform:translateX(-14px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes introPop{0%{transform:scale(0.6);opacity:0;}70%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);opacity:1;}}
  .intro-scanline{animation:introScan 1.8s ease-in-out infinite;}
  .intro-item{animation:introFadeUp .4s ease both;}
  .intro-item:nth-child(1){animation-delay:.1s;}
  .intro-item:nth-child(2){animation-delay:.35s;}
  .intro-item:nth-child(3){animation-delay:.6s;}
  .intro-cursor{animation:introBlink 1s step-end infinite;}
  .intro-row{animation:introSlideIn .5s ease both;animation-delay:.5s;}
  .intro-check{animation:introPop .4s ease both;animation-delay:1s;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STORAGE HELPERS ============================= */
const SHARED = true; // all lab data is shared across every user of this system
const DEFAULT_CONFIG = {
  labName: "A501 Lab",
  sheetsUrl: "https://script.google.com/macros/s/AKfycbwHDncJl4LqI8zDe8eCYSPhuAaMRzL6PFOwL4GpXPEjo9jIM-9qTUmYsFoG0cXlzlzajQ/exec",
  adminPin: "1234",
  equipment: [
    { id: "fs_laser",     name: "Fs Laser (20W)",                    envFields: true  },
    { id: "uvvis",        name: "UV-VIS Spectrometer",                envFields: true  },
    { id: "ftir",         name: "FTIR",                               envFields: true  },
    { id: "plasma",       name: "Plasma Cleaning Machine",            envFields: false },
    { id: "electrochem",  name: "Electrochemical Workstation",        envFields: false },
    { id: "confocal",     name: "3D Surface Profiler (Confocal)",     envFields: false }
  ]
};
const DAILY_ITEMS = [
  "FS 120W laser + Chiller + Work station + Suction system + Computers",
  "3D scanner for contouring",
  "Aerotech Work Station",
  "Fs laser + Shutter + Chiller + Work station + Suction system + Computers",
  "Ns laser + Chiller + Translation stages + Suction system + Computers",
  "Ultrasonic Cleaner",
  "Oven",
  "Vacuum Oven",
  "Plasma Cleaning machine + Air compressor",
  "UV-VIS spectrometer",
  "Spin Coater",
  "Weight Balance",
  "Electro-Chemical workstation + Computers",
  "3D confocal microscope + computer",
  "Contact angle meter",
  "FTIR + Computer",
  "Hot plate",
  "3D Printer",
  "Close the fume hood sash completely",
  "All chemicals bottles capped",
  "Remove the top sheet of the sticky mat if dirty or no longer sticky.",
  "Room light + Fume hood's light"
];

async function storageGet(key, fallback){
  try{
    if(window.storage){
      const r = await window.storage.get(key, SHARED);
      if(!r) return fallback;
      return JSON.parse(r.value);
    }
  }catch(e){ /* fall through to localStorage */ }
  try{
    const raw = localStorage.getItem("lls:"+key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function storageSet(key, value){
  try{
    if(window.storage){
      await window.storage.set(key, JSON.stringify(value), SHARED);
      return true;
    }
  }catch(e){ /* fall through to localStorage */ }
  try{ localStorage.setItem("lls:"+key, JSON.stringify(value)); return true; }
  catch(e){ console.error("storage set failed", e); return false; }
}

/* Push the shared parts of config (equipment list, lab name) into the Google Sheet's
   Config tab, so every device — regardless of how this page is hosted — sees the same
   equipment list and lab name, not just whoever's local browser storage. */
async function syncConfigToSheet(){
  if(!STATE.config.sheetsUrl) return;
  try{
    await fetch(STATE.config.sheetsUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'setConfig', config:{
        equipment_json: JSON.stringify(STATE.config.equipment),
        lab_name: STATE.config.labName,
        admin_pin: STATE.config.adminPin || "1234"
      }})
    });
  }catch(e){ console.error("config sync to sheet failed", e); }
}

/* Pull the shared parts of config down from the Sheet on load, so a fresh device
   (e.g. someone else's phone scanning the QR code) sees the current equipment list
   and lab name, not just whatever shipped in this file originally. */
async function syncConfigFromSheet(){
  if(!STATE.config.sheetsUrl) return;
  try{
    const res = await fetch(STATE.config.sheetsUrl + '?action=config');
    const remote = await res.json();
    if(remote && remote.equipment_json){
      const parsed = JSON.parse(remote.equipment_json);
      if(Array.isArray(parsed) && parsed.length) STATE.config.equipment = parsed;
    }
    if(remote && remote.lab_name){
      STATE.config.labName = remote.lab_name;
    }
    if(remote && remote.admin_pin){
      STATE.config.adminPin = String(remote.admin_pin);
    }
    if(!remote || !remote.equipment_json){
      // Sheet's Config tab is empty (first run) — seed it with what we have.
      await syncConfigToSheet();
    }
  }catch(e){ console.error("config sync from sheet failed", e); }
}

/* ============================= GOOGLE SHEETS BACKEND ============================= */
/* When STATE.config.sheetsUrl is set (via the Admin tab), every log entry is written
   directly to the lab's own Google Sheet through a small Apps Script web app, instead
   of the built-in artifact storage. Records reads live from the sheet too.
   Config (equipment list, lab name, the Sheets URL itself) always lives in the
   built-in storage, since it needs to be readable before we know which mode to use. */

const EQUIPMENT_HEADERS = ["Date","Start Time","End Time","Operator","Humidity (%)","Temp (C)","Activity",
  "Equipment Status","Notes","Submitted At","Session ID","Session Status","Completed At"];

function equipmentEntryToRow(entry){
  return [entry.date, entry.startTime, entry.endTime, entry.operator, entry.humidity, entry.temp,
    entry.activity, entry.status, entry.notes, entry.submittedAt,
    entry.sessionId||"", entry.sessionStatus||"", entry.completedAt||""];
}
function rowToEquipmentEntry(row){
  return { date:row[0]||"", startTime:row[1]||"", endTime:row[2]||"", operator:row[3]||"",
    humidity:row[4]||"", temp:row[5]||"", activity:row[6]||"",
    status:row[7]||"",
    notes:row[8]||"", submittedAt:row[9]||"",
    sessionId:row[10]||"", sessionStatus:row[11]||"", completedAt:row[12]||"" };
}
function generateSessionId(){
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
}
function dailyEntryToRow(entry){
  const base = [entry.date, entry.time, entry.userName];
  entry.items.forEach(it=> base.push(it.status + (it.extra ? (" — "+it.extra) : "")));
  base.push(entry.overallComments, entry.submittedAt);
  return base;
}
function rowToDailyEntry(row){
  const items = DAILY_ITEMS.map((label, idx)=>{
    const cell = String(row[3+idx] || "");
    const dashIdx = cell.indexOf(" — ");
    const extra = dashIdx>=0 ? cell.slice(dashIdx+3) : "";
    let status = "Off";
    if(cell.indexOf("In Use")===0) status = "In Use";
    else if(cell.indexOf("Support to Turn Off")===0) status = "Support to Turn Off";
    return { label, status, extra };
  });
  return { date:row[0]||"", time:row[1]||"", userName:row[2]||"", items,
    overallComments:row[3+DAILY_ITEMS.length]||"", submittedAt:row[3+DAILY_ITEMS.length+1]||"" };
}

async function checkTodayChecklist(){
  const list = await fetchSubmissions("Daily Checklist", "log:daily", rowToDailyEntry);
  const t = nowParts();
  return list.find(e=>e.date===t.date) || null;
}
async function goToDailyForm(){
  STATE.dailyFlow = {step:"loading"};
  STATE.screen = "dailyForm";
  render();
  const existing = await checkTodayChecklist();
  STATE.dailyFlow = existing ? {step:"blocked", existing} : {step:"form"};
  render();
}

async function sheetsFetch(url, opts){
  const res = await fetch(url, opts);
  return await res.json();
}

async function appendSubmission(sheetName, rowArray, fallbackKey, fallbackEntry){
  if(STATE.config.sheetsUrl){
    try{
      const data = await sheetsFetch(STATE.config.sheetsUrl, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'append', sheet:sheetName, row: rowArray })
      });
      return !!data.ok;
    }catch(e){ console.error("sheets append failed", e); return false; }
  } else {
    const list = await storageGet(fallbackKey, []);
    list.push(fallbackEntry);
    return await storageSet(fallbackKey, list);
  }
}

async function fetchSubmissions(sheetName, fallbackKey, rowToEntry){
  if(STATE.config.sheetsUrl){
    try{
      const data = await sheetsFetch(STATE.config.sheetsUrl + '?action=list&sheet=' + encodeURIComponent(sheetName));
      const rows = (data.rows||[]).filter(r=>r.some(c=>c!==""&&c!==null&&c!==undefined));
      return rows.map(rowToEntry);
    }catch(e){ console.error("sheets list failed", e); return []; }
  } else {
    return await storageGet(fallbackKey, []);
  }
}

/* Equipment check-in / check-out support. A "session" is one equipment-use cycle:
   started with a Start entry (Session Status = Open), later completed by finding
   that same row (via its Session ID) and filling in the end time / status / notes
   (Session Status = Closed). This is the one place the app updates an existing row
   instead of only appending — scoped narrowly to just those fields, on a row that
   is still Open, identified by a private session id rather than row position. */
async function fetchOpenSessions(sheetName, fallbackKey, operatorFilter){
  if(STATE.config.sheetsUrl){
    try{
      const url = STATE.config.sheetsUrl + '?action=openSessions&sheet=' + encodeURIComponent(sheetName) +
        (operatorFilter ? ('&operator=' + encodeURIComponent(operatorFilter)) : '');
      const data = await sheetsFetch(url);
      return Array.isArray(data) ? data : [];
    }catch(e){ console.error("openSessions fetch failed", e); return []; }
  } else {
    const list = await storageGet(fallbackKey, []);
    return list
      .filter(e => e.sessionStatus==="Open" && (!operatorFilter || (e.operator||"").trim().toLowerCase()===operatorFilter.trim().toLowerCase()))
      .map(e => ({ sessionId:e.sessionId, date:e.date, startTime:e.startTime, operator:e.operator, activity:e.activity }));
  }
}
async function closeSession(sheetName, sessionId, localUpdates, fallbackKey){
  if(STATE.config.sheetsUrl){
    const headerUpdates = {
      "End Time": localUpdates.endTime,
      "Equipment Status": localUpdates.status,
      "Notes": localUpdates.notes,
      "Session Status": "Closed",
      "Completed At": localUpdates.completedAt
    };
    try{
      const data = await sheetsFetch(STATE.config.sheetsUrl, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'closeSession', sheet: sheetName, sessionId, updates: headerUpdates })
      });
      return data;
    }catch(e){ console.error("closeSession failed", e); return {ok:false, error:"Network error"}; }
  } else {
    const list = await storageGet(fallbackKey, []);
    const idx = list.findIndex(e=>e.sessionId===sessionId);
    if(idx===-1) return {ok:false, error:"Session not found"};
    if(list[idx].sessionStatus==="Closed") return {ok:false, error:"Session already closed"};
    Object.assign(list[idx], {
      endTime: localUpdates.endTime, status: localUpdates.status, notes: localUpdates.notes,
      completedAt: localUpdates.completedAt, sessionStatus: "Closed"
    });
    await storageSet(fallbackKey, list);
    return {ok:true};
  }
}

let STATE = {
  screen: "home",       // home | equipmentForm | dailyForm | records | admin | share
  selection: "",
  config: null,
  submissions: {},       // cache: equipmentId -> array, 'daily' -> array
  recordsTarget: "daily",
  search: "",
  banner: "",
  adminUnlocked: false,  // Admin password gate resets every page load
  eqFlow: null,          // check-in/out flow state for the equipment form: {step, operatorName, openSession, blockingSession}
  dailyFlow: null,       // {step: "loading"|"form"|"blocked", existing} — limits the checklist to one submission per day
  dashboardData: null    // cached computed stats/open-issues for the Dashboard tab
};

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function nowParts(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return {
    date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}`
  };
}

/* ============================= ONBOARDING WALKTHROUGH ============================= */
const INTRO_STEPS = [
  {
    title: "Scan the QR code",
    body: "Anyone in the lab can scan the posted QR code to open this page directly — no login, no app to install.",
    icon: `<svg width="90" height="90" viewBox="0 0 90 90" fill="none">
      <rect x="8" y="8" width="74" height="74" rx="4" stroke="#20242A" stroke-width="2"/>
      <rect x="16" y="16" width="16" height="16" fill="#20242A"/>
      <rect x="58" y="16" width="16" height="16" fill="#20242A"/>
      <rect x="16" y="58" width="16" height="16" fill="#20242A"/>
      <rect x="40" y="40" width="10" height="10" fill="#C07A2C"/>
      <rect x="56" y="56" width="6" height="6" fill="#20242A"/>
      <rect x="66" y="40" width="6" height="6" fill="#20242A"/>
      <line class="intro-scanline" x1="12" y1="45" x2="78" y2="45" stroke="#C07A2C" stroke-width="3"/>
    </svg>`
  },
  {
    title: "Choose what you're logging",
    body: "Pick the Daily Checklist or a piece of equipment from the dropdown — the right form opens automatically.",
    icon: `<svg width="120" height="90" viewBox="0 0 120 90" fill="none">
      <rect x="10" y="10" width="100" height="70" rx="4" stroke="#20242A" stroke-width="2"/>

function shouldShowIntro(){
  try{ return !localStorage.getItem("lls:seenIntro"); }catch(e){ return false; }
}
function markIntroSeen(){
  try{ localStorage.setItem("lls:seenIntro","1"); }catch(e){}
}
function showIntroOverlay(){
  let step = 0;
  const overlay = document.createElement('div');
  overlay.className = "intro-overlay";
  document.body.appendChild(overlay);

  function renderStep(){
    const s = INTRO_STEPS[step];
    overlay.innerHTML = `
      <div class="intro-card">
        <div class="intro-icon-wrap">${s.icon}</div>
        <h2 class="intro-title">${s.title}</h2>
        <p class="intro-body">${s.body}</p>
        <div class="intro-dots">${INTRO_STEPS.map((_,i)=>`<div class="intro-dot ${i===step?'active':''}"></div>`).join('')}</div>
        <div class="intro-btnrow">
          <button class="intro-skip">Skip</button>
          <button class="intro-next">${step===INTRO_STEPS.length-1 ? "Get started" : "Next"}</button>
        </div>
      </div>
    `;
    overlay.querySelector('.intro-skip').onclick = close;
    overlay.querySelector('.intro-next').onclick = ()=>{
      if(step < INTRO_STEPS.length-1){ step++; renderStep(); }
      else { close(); }
    };
  }
  function close(){
    markIntroSeen();
    overlay.remove();
  }
  renderStep();
}

/* ============================= BOOTSTRAP ============================= */
async function boot(){
  let cfg = await storageGet("config", null);
  if(!cfg){ cfg = DEFAULT_CONFIG; await storageSet("config", cfg); }
  STATE.config = cfg;
  render();
  // Pull the latest shared equipment list / lab name from the Sheet (if connected),
  // then re-render once that's back — this is what keeps every device in sync.
  await syncConfigFromSheet();
  await storageSet("config", STATE.config);
  render();
  if(shouldShowIntro()) showIntroOverlay();
}

/* ============================= EQUIPMENT FORM (check-in / check-out) ============================= */
function screenEquipmentForm(){
  const eq = STATE.config.equipment.find(e=>e.id===STATE.selection);
  if(!eq){ STATE.screen="home"; return screenHome(); }
  if(!STATE.eqFlow) STATE.eqFlow = {step:"name", operatorName:""};

  switch(STATE.eqFlow.step){
    case "name":    return screenEqName(eq);
    case "loading": return el(`<div class="card"><p class="lead">Checking for an open session…</p></div>`);
    case "start":   return screenEqStart(eq);
    case "finish":  return screenEqFinish(eq);
    case "blocked": return screenEqBlocked(eq);
    default:        return screenEqName(eq);
  }

function screenEqName(eq){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`

  `));
  const card = el(`<div class="card"></div>`);
  const nameInput = el(`<input type="text" required placeholder="Full name or initials" value="${STATE.eqFlow.operatorName||''}">`);
  card.appendChild(wrapField("Your name", nameInput));

  cancelBtn.onclick = ()=>{ STATE.screen="home"; render(); };
  btnRow.appendChild(nextBtn); btnRow.appendChild(cancelBtn);
  card.appendChild(btnRow);

  const proceed = async ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    STATE.eqFlow.operatorName = name;
    STATE.eqFlow.step = "loading";
    render();
    const [mine, allOpen] = await Promise.all([
      fetchOpenSessions(eq.name, "log:"+eq.id, name),
      fetchOpenSessions(eq.name, "log:"+eq.id, null)
    ]);

      STATE.eqFlow.step = "start";

    render();
  };
  nextBtn.onclick = proceed;
  nameInput.addEventListener('keydown', e=>{ if(e.key==="Enter"){ e.preventDefault(); proceed(); } });

/* ============================= DASHBOARD ============================= */
function monthKey(dateStr){ return dateStr ? String(dateStr).slice(0,7) : ""; } // "YYYY-MM"

async function computeDashboardData(){
  const thisMonth = nowParts().date.slice(0,7);
  const equipmentStats = [];
  const openIssues = [];

  for(const eq of STATE.config.equipment){
    const list = await fetchSubmissions(eq.name, "log:"+eq.id, rowToEquipmentEntry);
    const totalUses = list.length;
    const usesThisMonth = list.filter(r=>monthKey(r.date)===thisMonth).length;
    const issuesThisMonth = list.filter(r=>monthKey(r.date)===thisMonth && r.status && r.status!=="Operational").length;
    equipmentStats.push({ name: eq.name, totalUses, usesThisMonth, issuesThisMonth });

    if(list.length){
      const latest = list.slice().sort((a,b)=>(a.submittedAt||"").localeCompare(b.submittedAt||"")).pop();
      if(latest.status && latest.status !== "Operational"){
        openIssues.push({
          type:"equipment", label: eq.name, status: latest.status,
          date: latest.date, operator: latest.operator, notes: latest.notes
        });
      }
    }
  }

  const dailyList = await fetchSubmissions("Daily Checklist", "log:daily", rowToDailyEntry);
  if(dailyList.length){
    const latestDaily = dailyList.slice().sort((a,b)=>(a.submittedAt||"").localeCompare(b.submittedAt||"")).pop();
    latestDaily.items.filter(i=>i.status==="Support to Turn Off").forEach(i=>{
      openIssues.push({
        type:"checklist", label: i.label, status: "Support to Turn Off",
        date: latestDaily.date, operator: latestDaily.userName, notes: i.extra
      });
    });
  }

  equipmentStats.sort((a,b)=> b.issuesThisMonth - a.issuesThisMonth || b.usesThisMonth - a.usesThisMonth);
  return { equipmentStats, openIssues, thisMonth, generatedAt: new Date() };
}

async function goToDashboard(){
  STATE.screen = "dashboard";
  STATE.dashboardData = null;
  render();
  STATE.dashboardData = await computeDashboardData();
  render();
}

function screenDashboard(){

      <h1>Lab activity at a glance</h1>
      <p class="lead">Usage and flagged issues, computed from your live records. Refresh anytime — nothing here is stored separately.</p>

  `));

  const issuesCard = el(`<div class="card"></div>`);

  const table2 = el(`<table class="recs"><thead><tr>
    <th>Equipment</th><th>Uses this month</th><th>Issues this month</th><th>Total uses (all time)</th>
  </tr></thead><tbody></tbody></table>`);

  equipmentStats.forEach(s=>{
    tbody2.insertAdjacentHTML('beforeend', `<tr>
      <td>${s.name}</td>
      <td>${s.usesThisMonth}</td>

  });

  const refreshBtn = el(`<button class="secondary">Refresh</button>`);
  refreshBtn.onclick = ()=> goToDashboard();
  const refreshCard = el(`<div class="card"></div>`);
  refreshCard.appendChild(refreshBtn);
  wrap.appendChild(refreshCard);

  return wrap;
}

/* ============================= RECORDS ============================= */
function screenRecords(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="card">
      <p class="eyebrow">Records</p>
      <h1>Search &amp; export</h1>
      <p class="lead">Every submission lives here, grouped by log. Nothing is ever overwritten. Export any log to Excel/CSV at any time for backup or review.</p>
    </div>
  `));

  const selCard = el(`<div class="card"></div>`);
  const sel = document.createElement('select');
  sel.appendChild(el(`<option value="daily">Daily Laboratory Checklist</option>`));
  STATE.config.equipment.forEach(eq=> sel.appendChild(el(`<option value="${eq.id}">${eq.name}</option>`)));
  sel.value = STATE.recordsTarget;
  sel.onchange = ()=>{ STATE.recordsTarget = sel.value; render(); };
  selCard.appendChild(wrapField("Choose a log to view", sel));
  wrap.appendChild(selCard);

  const target = STATE.recordsTarget;
  const isDaily = target==="daily";
  const sheetName = isDaily ? "Daily Checklist" : (STATE.config.equipment.find(e=>e.id===target)||{}).name || target;
  const fallbackKey = isDaily ? "log:daily" : "log:"+target;

  const holder = el(`<div class="card"><div class="loading">Loading records…</div></div>`);
  wrap.appendChild(holder);

  (async ()=>{
    const list = await fetchSubmissions(sheetName, fallbackKey, isDaily ? rowToDailyEntry : rowToEquipmentEntry);
    holder.innerHTML = "";
    const header = el(`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;"></div>`);
    header.appendChild(el(`<h2 style="margin:0;">${list.length} record${list.length===1?"":"s"}</h2>`));
    const exportBtn = el(`<button class="secondary small">Export to Excel</button>`);
    exportBtn.onclick = ()=> exportToExcel(target, list);
    header.appendChild(exportBtn);
    holder.appendChild(header);

    const searchRow = el(`<div class="search-row"></div>`);
    const searchInput = el(`<input type="text" placeholder="Search all fields…" value="${STATE.search}">`);
    searchInput.oninput = ()=>{ STATE.search = searchInput.value; renderTable(); };
    searchRow.appendChild(searchInput);
    holder.appendChild(searchRow);

    const tableHolder = el(`<div></div>`);
    holder.appendChild(tableHolder);

    function renderTable(){
      tableHolder.innerHTML = "";
      let rows = list;
      const q = STATE.search.trim().toLowerCase();
      if(q){
        rows = list.filter(r => JSON.stringify(r).toLowerCase().includes(q));
      }
      if(rows.length===0){
        tableHolder.appendChild(el(`<div class="empty">No records yet.</div>`));
        return;
      }
      if(target==="daily"){
        const tw = el(`<div class="table-wrap"></div>`);
        const table = el(`<table class="recs"><thead><tr>
          <th>Date</th><th>Time</th><th>Checked by</th><th>In use / pending shutdown</th><th>Comments</th>
        </tr></thead><tbody></tbody></table>`);
        const tbody = table.querySelector('tbody');
        rows.slice().reverse().forEach(r=>{
          const inUse = r.items.filter(i=>i.status==="In Use");
          const support = r.items.filter(i=>i.status==="Support to Turn Off");
          const flagged = inUse.length + support.length;
          const parts = [];
          inUse.forEach(i=> parts.push(`${i.label.slice(0,28)}… — in use (${i.extra||"no initials"})`));
          support.forEach(i=> parts.push(`${i.label.slice(0,28)}… — pending shutdown${i.extra ? (": "+i.extra) : ""}`));
          const flagText = parts.length ? parts.join(" | ") : "All off";
          tbody.insertAdjacentHTML('beforeend', `<tr>
            <td>${r.date}</td><td>${r.time}</td><td>${r.userName}</td>
            <td>${flagged ? `<span class="status-pill status-warn">${flagged} flagged</span>` : `<span class="status-pill status-ok">All off</span>`}<br>${flagText}</td>
            <td>${r.overallComments||""}</td>
          </tr>`);
        });
        tw.appendChild(table); tableHolder.appendChild(tw);
      } else {
        const tw = el(`<div class="table-wrap"></div>`);
        const table = el(`<table class="recs"><thead><tr>
          <th>Session</th><th>Date</th><th>Start</th><th>End</th><th>Operator</th><th>Activity</th><th>Status</th><th>Notes</th>
        </tr></thead><tbody></tbody></table>`);
        const tbody = table.querySelector('tbody');
        rows.slice().reverse().forEach(r=>{
          const cls = r.status==="Operational" ? "status-ok" : (r.status==="Out of service" ? "status-bad" : "status-warn");
          const sessionPill = r.sessionStatus==="Open"
            ? `<span class="status-pill status-warn">Open</span>`
            : (r.sessionStatus==="Closed" ? `<span class="status-pill status-ok">Closed</span>` : "");
          tbody.insertAdjacentHTML('beforeend', `<tr>
            <td>${sessionPill}</td><td>${r.date}</td><td>${r.startTime||""}</td><td>${r.endTime||""}</td><td>${r.operator}</td>
            <td>${r.activity}</td><td>${r.status ? `<span class="status-pill ${cls}">${r.status}</span>` : ""}</td>
            <td>${r.notes||""}</td>
          </tr>`);
        });
        tw.appendChild(table); tableHolder.appendChild(tw);
      }
    }
    renderTable();
  })();

  return wrap;
}

function exportToExcel(target, list){
  let rows;
  let filename;
  if(target==="daily"){
    filename = "Daily_Checklist_Log.xlsx";
    rows = list.map(r=>{
      const base = { Date:r.date, Time:r.time, "Checked By":r.userName, "Overall Comments":r.overallComments };
      r.items.forEach((it,idx)=>{ base["Item "+(idx+1)] = it.status + (it.extra ? (" — "+it.extra) : ""); });
      base["Submitted At"] = r.submittedAt;
      return base;
    });
  } else {
    const eq = STATE.config.equipment.find(e=>e.id===target);
    filename = (eq?eq.name:target).replace(/[^a-z0-9]+/gi,"_") + "_Log.xlsx";
    rows = list.map(r=>({
      Date:r.date, "Start Time":r.startTime, "End Time":r.endTime, Operator:r.operator,
      "Humidity (%)":r.humidity, "Temp (°C)":r.temp, Activity:r.activity,
      "Equipment Status":r.status, Notes:r.notes, "Submitted At":r.submittedAt,
      "Session ID":r.sessionId, "Session Status":r.sessionStatus, "Completed At":r.completedAt
    }));
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Log");
  XLSX.writeFile(wb, filename);
}

/* ============================= SHARE / QR ============================= */
function screenShare(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="card">
      <p class="eyebrow">One QR code for the whole lab</p>
      <h1>Share this system</h1>
      <p class="lead">Print the QR code below and post it in the lab. Anyone who scans it opens this exact page, picks an entry from the dropdown, and their submission is saved automatically — no app to install, no login.</p>

      holder.innerHTML = "<div class='empty'>QR library still loading — try reopening this tab.</div>";

  const note = el(`
    <div class="card">
      <h2>Hosting this page</h2>
      <p class="lead">The QR code above always encodes whatever URL is currently loaded in this browser tab. For a stable QR code you can print, host this file somewhere with a permanent address that anyone can open without logging in (e.g. GitHub Pages), then reopen this Share tab from that address before printing.</p>
    </div>
  `);

/* ============================= ADMIN LOCK ============================= */
function screenAdminLock(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="card">
      <p class="eyebrow">Administrator</p>
      <h1>Enter Password</h1>
      <p class="lead">This area is for lab administrators only — adding/removing equipment, connecting Google Sheets, and full backups.</p>
    </div>
  `));
  const card = el(`<div class="card"></div>`);
  const pinInput = el(`<input type="password" autocomplete="off" placeholder="Enter admin password">`);
  card.appendChild(wrapField("Password", pinInput));
  const errorMsg = el(`<p class="lead" style="color:#a83e2c;display:none;">Incorrect password — try again.</p>`);
  card.appendChild(errorMsg);
  const btnRow = el(`<div class="btnrow"></div>`);
  const unlockBtn = el(`<button class="primary">Unlock</button>`);
  const tryUnlock = ()=>{
    if(pinInput.value === (STATE.config.adminPin || "1234")){
      STATE.adminUnlocked = true;
      render();
    } else {
      errorMsg.style.display = "block";
      pinInput.value = "";
      pinInput.focus();
    }
  };
  unlockBtn.onclick = tryUnlock;
  pinInput.addEventListener('keydown', e=>{ if(e.key === "Enter") tryUnlock(); });
  btnRow.appendChild(unlockBtn);
  card.appendChild(btnRow);
  wrap.appendChild(card);
  setTimeout(()=>pinInput.focus(), 50);
  return wrap;
}

/* ============================= ADMIN ============================= */
function screenAdmin(){
  if(!STATE.adminUnlocked){
    return screenAdminLock();
  }
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="card">
      <p class="eyebrow">Administrator</p>
      <h1>Manage equipment list</h1>
      <p class="lead">Add a new instrument and it appears in the dropdown immediately, with its own spreadsheet. Removing an instrument here does not delete its historical records — only new entries stop being offered.</p>
    </div>
  `));

  const sessionsCard = el(`<div class="card"><h2>Open equipment sessions</h2><p class="lead">Sessions someone started but hasn't logged an end time for yet. If someone forgot to close one out, an admin can force-close it here so the equipment isn't stuck.</p><div class="sessions-holder"><p class="lead">Checking…</p></div></div>`);
  wrap.appendChild(sessionsCard);
  const loadOpenSessions = async ()=>{
    const holder = sessionsCard.querySelector('.sessions-holder');
    const results = [];
    for(const eq of STATE.config.equipment){
      const open = await fetchOpenSessions(eq.name, "log:"+eq.id, null);
      open.forEach(s => results.push({eq, s}));
    }
    holder.innerHTML = "";
    if(!results.length){
      holder.appendChild(el(`<div class="empty">No open sessions right now.</div>`));
      return;
    }
    results.forEach(({eq,s})=>{
      const row = el(`<div class="eq-row">
        <div><div class="eq-name">${eq.name} — ${s.operator}</div><div class="eq-meta">started ${s.date} ${s.startTime}${s.activity ? (" · "+s.activity) : ""}</div></div>
      </div>`);
      const closeBtn = el(`<button class="ghost danger">Force close</button>`);
      closeBtn.onclick = async ()=>{
        if(!confirm(`Force-close this session on ${eq.name} (started by ${s.operator})? This logs an end time now with no status/notes from the original operator.`)) return;
        const t = nowParts();
        const result = await closeSession(eq.name, s.sessionId, {
          endTime: t.time, status: "Operational",
          notes: "Force-closed by administrator — operator did not log an end time.",
          completedAt: new Date().toISOString()
        }, "log:"+eq.id);
        if(result && result.ok){ loadOpenSessions(); } else { alert((result&&result.error)||"Could not close this session."); }
      };
      row.appendChild(closeBtn);
      holder.appendChild(row);
    });
  };
  loadOpenSessions();

  const sheetsCard = el(`<div class="card"><h2>Data storage — Google Sheets</h2></div>`);
  const connected = !!STATE.config.sheetsUrl;
  sheetsCard.appendChild(el(`
    <div class="banner" style="background:${connected?'#d9ece6':'#f1ddb8'};border-color:${connected?'#2f6f63':'#c07a2c'};color:${connected?'#2f6f63':'#c07a2c'};">
      ${connected ? "Connected — every submission is written directly to your Google Sheet." : "Not connected — submissions are currently saved in this app's built-in storage, not a spreadsheet you own."}
    </div>
  `));
  sheetsCard.appendChild(el(`<p class="lead">To route every log entry straight into your own Google Sheet: open the "A501 Lab Log System" spreadsheet in Drive, Extensions &rarr; Apps Script, paste in the provided backend code, then Deploy &rarr; New deployment &rarr; Web app (Execute as: Me, Who has access: Anyone). Paste the resulting URL below.</p>`));
  const sheetsUrlInput = el(`<input type="text" placeholder="https://script.google.com/macros/s/.../exec" value="${STATE.config.sheetsUrl||''}">`);
  sheetsCard.appendChild(wrapField("Google Sheets Web App URL", sheetsUrlInput));
  const sheetsBtnRow = el(`<div class="btnrow"></div>`);
  const sheetsSaveBtn = el(`<button class="primary">Save &amp; connect</button>`);
  sheetsSaveBtn.onclick = async ()=>{
    STATE.config.sheetsUrl = sheetsUrlInput.value.trim();
    await storageSet("config", STATE.config);
    await syncConfigToSheet();
    STATE.banner = STATE.config.sheetsUrl ? "Connected to your Google Sheet. New submissions will be written there." : "Disconnected — back to built-in storage.";
    STATE.screen = "admin";
    render();
  };
  sheetsBtnRow.appendChild(sheetsSaveBtn);
  if(connected){
    const disconnectBtn = el(`<button class="secondary">Disconnect</button>`);
    disconnectBtn.onclick = async ()=>{
      STATE.config.sheetsUrl = "";
      await storageSet("config", STATE.config);
      render();
    };
    sheetsBtnRow.appendChild(disconnectBtn);
  }
  sheetsCard.appendChild(sheetsBtnRow);
  wrap.appendChild(sheetsCard);

  const listCard = el(`<div class="card"><h2>Current equipment</h2></div>`);
  STATE.config.equipment.forEach(eq=>{
    const row = el(`<div class="eq-row">
      <div><div class="eq-name">${eq.name}</div><div class="eq-meta">id: ${eq.id} ${eq.envFields ? "· humidity/temp fields on" : ""}</div></div>
    </div>`);
    const rm = el(`<button class="ghost danger">Remove</button>`);
    rm.onclick = async ()=>{
      if(!confirm(`Remove "${eq.name}" from the dropdown? Its past records are kept and still exportable.`)) return;
      STATE.config.equipment = STATE.config.equipment.filter(e=>e.id!==eq.id);
      await storageSet("config", STATE.config);
      await syncConfigToSheet();
      render();
    };
    row.appendChild(rm);
    listCard.appendChild(row);
  });
  wrap.appendChild(listCard);

  const addCard = el(`<div class="card"><h2>Add new equipment</h2></div>`);
  const nameInput = el(`<input type="text" placeholder="e.g. Contact Angle Meter">`);
  addCard.appendChild(wrapField("Equipment name", nameInput));
  const envToggle = el(`<label class="toggle-row"><input type="checkbox"><span>Include humidity / temperature fields (for instruments sensitive to ambient conditions)</span></label>`);
  addCard.appendChild(envToggle);
  const addBtn = el(`<button class="primary">Add equipment</button>`);
  addBtn.onclick = async ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + "_" + Date.now().toString(36).slice(-4);
    STATE.config.equipment.push({ id, name, envFields: envToggle.querySelector('input').checked });
    await storageSet("config", STATE.config);
    await syncConfigToSheet();
    STATE.banner = `Added "${name}" — it now appears in the Log Entry dropdown.`;
    STATE.screen = "home";
    render();
  };
  addCard.appendChild(addBtn);
  wrap.appendChild(addCard);

  const labCard = el(`<div class="card"><h2>Lab name</h2></div>`);
  const labInput = el(`<input type="text" value="${STATE.config.labName}">`);
  labCard.appendChild(wrapField("Displayed at the top of the app", labInput));
  const labBtn = el(`<button class="secondary">Save name</button>`);
  labBtn.onclick = async ()=>{
    STATE.config.labName = labInput.value.trim() || STATE.config.labName;
    await storageSet("config", STATE.config);
    await syncConfigToSheet();
    render();
  };
  labCard.appendChild(labBtn);
  wrap.appendChild(labCard);

  const pinCard = el(`<div class="card"><h2>Admin Password</h2><p class="lead">Change the password required to access this Admin area. Anyone with the password can add/remove equipment, change connections, and download full backups.</p></div>`);
  const pinChangeInput = el(`<input type="text" placeholder="New password" value="${STATE.config.adminPin||'1234'}">`);
  pinCard.appendChild(wrapField("Admin Password", pinChangeInput));
  const pinChangeBtn = el(`<button class="secondary">Save Password</button>`);
  pinChangeBtn.onclick = async ()=>{
    const newPin = pinChangeInput.value.trim();
    if(!newPin) return;
    STATE.config.adminPin = newPin;
    await storageSet("config", STATE.config);
    await syncConfigToSheet();
    STATE.banner = "Admin password updated.";
    render();
  };
  pinCard.appendChild(pinChangeBtn);
  wrap.appendChild(pinCard);

  const lockBtn = el(`<button class="ghost">Lock admin area now</button>`);
  lockBtn.onclick = ()=>{ STATE.adminUnlocked = false; STATE.screen = "admin"; render(); };
  wrap.appendChild(lockBtn);

  const bkCard = el(`<div class="card"><h2>Full backup</h2><p class="lead">Download every log — the daily checklist and every piece of equipment — as one Excel workbook with one sheet per log.</p></div>`);
  const bkBtn = el(`<button class="secondary">Export full backup (.xlsx)</button>`);
  bkBtn.onclick = async ()=>{
    const wb = XLSX.utils.book_new();
    const daily = await fetchSubmissions("Daily Checklist", "log:daily", rowToDailyEntry);
    const dailyRows = daily.map(r=>{
      const base = { Date:r.date, Time:r.time, "Checked By":r.userName, "Overall Comments":r.overallComments };
      r.items.forEach((it,idx)=>{ base["Item "+(idx+1)] = it.status + (it.extra?(" — "+it.extra):""); });
      base["Submitted At"]=r.submittedAt;
      return base;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dailyRows), "Daily Checklist");
    for(const eq of STATE.config.equipment){
      const list = await fetchSubmissions(eq.name, "log:"+eq.id, rowToEquipmentEntry);
      const rows = list.map(r=>({
        Date:r.date,"Start Time":r.startTime,"End Time":r.endTime,Operator:r.operator,
        "Humidity (%)":r.humidity,"Temp (°C)":r.temp,Activity:r.activity,
        "Equipment Status":r.status,Notes:r.notes,"Submitted At":r.submittedAt,
        "Session ID":r.sessionId,"Session Status":r.sessionStatus,"Completed At":r.completedAt
      }));
      const sheetName = eq.name.replace(/[\[\]\*\/\\\?:]/g,'').slice(0,31) || eq.id;
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName);
    }
    XLSX.writeFile(wb, "Lab_Log_Full_Backup_"+nowParts().date+".xlsx");
  };
  bkCard.appendChild(bkBtn);
  wrap.appendChild(bkCard);

  return wrap;
}

boot();
